[package]
name = "hyprlnk"
description = "The fastest linker for Windows (x64, ARM64, x86) and macOS (arm64, arm64e, x86_64): a drop-in for link.exe, lld-link, ld64 and ld64.lld, built into the Rune build system"
version = "2027.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/runepm/rune"
homepage = "https://runepm.com"
documentation = "https://docs.rs/hyprlnk"
readme = "README.md"
keywords = ["linker", "pdb", "coff", "macho", "lld"]
categories = ["development-tools::build-utils", "command-line-utilities"]
# Self-contained on purpose (no `workspace = true`): this directory can be
# built, published and moved on its own.
exclude = ["/.github", "/tests/fixtures/big"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hyprlnk"
path = "src/main.rs"

[dependencies]
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = { version = "0.17", default-features = false }
rustc-demangle = "0.1"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
