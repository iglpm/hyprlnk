name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  windows:
    # The end-to-end tests link real programs and run them: on the x64
    # runner for x64 and x86 (and ARM64 images compared with lld-link), on
    # the ARM64 runner for ARM64.
    name: Test (Windows ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Link a release build of hyprlnk with itself
        shell: pwsh
        run: |
          cargo build --release
          $hyprlnk = Resolve-Path target/release/hyprlnk.exe
          Copy-Item $hyprlnk "$env:RUNNER_TEMP/hyprlnk-stage0.exe"
          $env:RUSTFLAGS = "-C linker=$env:RUNNER_TEMP/hyprlnk-stage0.exe"
          cargo build --release --target-dir target/self
          ./target/self/release/hyprlnk.exe --version

  unix:
    # The linker itself is portable (it can cross-link Windows images from
    # anywhere); its unit tests run everywhere. On macOS, `tests/macho.rs`
    # links real programs with rustc and clang and runs them; on Linux,
    # `tests/elf.rs` does with rustc, gcc and g++.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Link a release build of hyprlnk with itself
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cp target/release/hyprlnk "$RUNNER_TEMP/hyprlnk-stage0"
          RUSTFLAGS="-C linker=$RUNNER_TEMP/hyprlnk-stage0" cargo build --release --target-dir target/self
          ./target/self/release/hyprlnk --version
          readelf -p .comment target/self/release/hyprlnk | grep "Linker: hyprlnk"

  linux-cross:
    # Every other Linux architecture: static musl programs that unwind, use
    # threads and thread locals and print backtraces, linked by hyprlnk and
    # run under qemu-user.
    name: Test (Linux, other architectures under qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf,
            arm-unknown-linux-musleabihf, i686-unknown-linux-musl,
            riscv64gc-unknown-linux-musl, powerpc64le-unknown-linux-musl,
            loongarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: cargo test --test elf other_architectures_run_under_qemu -- --nocapture
        env:
          HYPRLNK_TEST_ALL_ARCHES: "1"

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --all-targets
