name: Release

# Push a tag such as `v2027.0.0` to build hyprlnk for every Windows machine
# and publish a GitHub release with the archives and their checksums.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GIT_AUTHOR_NAME: "runified"
  GIT_AUTHOR_EMAIL: "runified@runepm.com"
  GIT_COMMITTER_NAME: "runified"
  GIT_COMMITTER_EMAIL: "runified@runepm.com"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: [self-hosted, docker-builds]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
          - target: i686-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Podman and build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns zip
          podman info || true

      - name: Build hyprlnk locally first
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --locked
          echo "$PWD/target/release" >> $GITHUB_PATH

      - name: Cross-compile target with hyprcross
        env:
          HYPRCROSS_CONTAINER_ENGINE: podman
        run: |
          hyprcross cross build --release --locked --target ${{ matrix.target }} || \
          cargo run --release -- cross build --release --locked --target ${{ matrix.target }} || \
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="hyprlnk-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          
          bin_path=$(find target/ -name "hyprlnk.exe" | grep "${{ matrix.target }}" | head -n 1)
          if [ -z "$bin_path" ]; then
            bin_path="target/release/hyprlnk.exe"
          fi

          cp "$bin_path" "$name/hyprlnk.exe"
          cp README.md CHANGELOG.md LICENSE-MIT.md LICENSE-APACHE.md "$name/" 2>/dev/null || true
          
          zip -r "$name.zip" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            shasum -a 256 "$name.zip" > "$name.zip.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: hyprlnk-*.zip*

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, ci]
    permissions:
      contents: write
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "hyprlnk ${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed." \
            --verify-tag
